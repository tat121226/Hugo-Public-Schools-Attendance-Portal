<style>
  :root {
    --black: #111111;
    --black-soft: #1d1d1d;
    --gold: #c5b358;
    --gold-dark: #9d8d38;
    --gold-light: #f3edcf;
    --white: #ffffff;
    --page: #f4f5f7;
    --border: #d9dce1;
    --text: #202124;
    --muted: #666b73;
    --success: #18794e;
    --success-light: #e8f5ee;
    --danger: #b42318;
    --danger-light: #fef0ee;
    --warning: #8a5a00;
    --warning-light: #fff5d6;
    --shadow: 0 12px 30px rgba(0, 0, 0, 0.09);
    --radius: 14px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--page);
  }

  body {
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    background: var(--page);
    font-family:
      Arial,
      Helvetica,
      sans-serif;
    line-height: 1.5;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  button {
    cursor: pointer;
  }

  a {
    color: inherit;
  }

  .is-hidden {
    display: none !important;
  }

  .sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .attendance-page {
    min-height: 100vh;
  }

  /*
   * Loading and system error screens
   */

  .page-loading,
  .system-error {
    min-height: 100vh;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .page-loading strong,
  .system-error h1 {
    margin: 18px 0 6px;
    color: var(--black);
  }

  .page-loading span,
  .system-error p {
    max-width: 520px;
    margin: 0;
    color: var(--muted);
  }

  .page-loading__spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #dedede;
    border-top-color: var(--gold-dark);
    border-radius: 50%;
    animation: attendance-spin 0.8s linear infinite;
  }

  .system-error__icon {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    color: var(--white);
    background: var(--danger);
    border-radius: 50%;
    font-size: 32px;
    font-weight: 800;
  }

  .system-error .button {
    margin-top: 22px;
  }

  @keyframes attendance-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /*
   * Header and navigation
   */

  .attendance-header {
    position: sticky;
    top: 0;
    z-index: 50;
    color: var(--white);
    background: var(--black);
    border-bottom: 4px solid var(--gold);
  }

  .attendance-header__inner {
    width: min(1240px, calc(100% - 40px));
    min-height: 76px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .attendance-brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .attendance-brand__mark {
    width: 44px;
    height: 44px;
    display: grid;
    flex: 0 0 44px;
    place-items: center;
    color: var(--black);
    background: var(--gold);
    border-radius: 10px;
    font-size: 25px;
    font-weight: 900;
  }

  .attendance-brand span {
    display: block;
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .attendance-brand h1 {
    margin: 2px 0 0;
    font-size: 20px;
    line-height: 1.2;
  }

  .attendance-user {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .attendance-user__details {
    text-align: right;
  }

  .attendance-user__details strong,
  .attendance-user__details span {
    display: block;
  }

  .attendance-user__details strong {
    font-size: 14px;
  }

  .attendance-user__details span {
    color: #d4d4d4;
    font-size: 12px;
  }

  .menu-button {
    display: none;
    width: 44px;
    height: 44px;
    padding: 10px;
    border: 1px solid #555;
    border-radius: 8px;
    color: var(--white);
    background: transparent;
  }

  .menu-button span {
    display: block;
    width: 100%;
    height: 2px;
    margin: 4px 0;
    background: currentColor;
  }

  .attendance-navigation {
    width: min(1240px, calc(100% - 40px));
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    gap: 4px;
  }

  .navigation-button {
    min-height: 47px;
    padding: 12px 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #e8e8e8;
    background: transparent;
    border: 0;
    border-bottom: 3px solid transparent;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
  }

  .navigation-button:hover,
  .navigation-button:focus-visible,
  .navigation-button.is-active {
    color: var(--white);
    background: rgba(255, 255, 255, 0.07);
    border-bottom-color: var(--gold);
    outline: none;
  }

  .navigation-button--logout {
    margin-left: auto;
    color: #ffb8b2;
  }

  /*
   * Main content
   */

  .attendance-main {
    width: min(1240px, calc(100% - 40px));
    margin: 0 auto;
    padding: 34px 0 50px;
  }

  .attendance-section {
    display: block;
  }

  .page-heading {
    margin-bottom: 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .eyebrow {
    display: block;
    margin-bottom: 5px;
    color: var(--gold-dark);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.12em;
  }

  .page-heading h2 {
    margin: 0;
    color: var(--black);
    font-size: clamp(25px, 4vw, 34px);
    line-height: 1.15;
  }

  .page-heading p {
    max-width: 690px;
    margin: 8px 0 0;
    color: var(--muted);
  }

  .report-status {
    flex: 0 0 auto;
    padding: 8px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }

  .report-status--new {
    color: var(--warning);
    background: var(--warning-light);
  }

  .report-status--saved {
    color: var(--success);
    background: var(--success-light);
  }

  .content-card,
  .save-panel {
    margin-bottom: 22px;
    padding: 24px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.045);
  }

  .content-card__heading {
    margin-bottom: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
  }

  .content-card__heading h3 {
    margin: 0;
    color: var(--black);
    font-size: 19px;
  }

  .content-card__heading p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  /*
   * Fields and buttons
   */

  .field-group {
    min-width: 0;
  }

  .field-group label {
    display: block;
    margin-bottom: 7px;
    color: var(--black);
    font-size: 13px;
    font-weight: 800;
  }

  .field-group input,
  .field-group select,
  .student-search input,
  .table-search input {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    color: var(--text);
    background: var(--white);
    border: 1px solid #bfc3c9;
    border-radius: 8px;
    outline: none;
  }

  .field-group input:focus,
  .field-group select:focus,
  .student-search input:focus,
  .table-search input:focus {
    border-color: var(--gold-dark);
    box-shadow: 0 0 0 3px rgba(197, 179, 88, 0.2);
  }

  .field-group input:disabled,
  .field-group select:disabled {
    color: #626262;
    background: #eeeeee;
    cursor: not-allowed;
  }

  .field-group small {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
  }

  .report-settings {
    display: grid;
    grid-template-columns:
      minmax(180px, 1.2fr)
      minmax(150px, 0.8fr)
      minmax(190px, 1fr)
      auto;
    align-items: start;
    gap: 18px;
  }

  .report-settings__action,{
    padding-top: 27px
  }
  .overview-filters__action {
    padding-bottom: 1px;
  }

  .button {
    min-height: 44px;
    padding: 10px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border: 1px solid transparent;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 800;
    transition:
      transform 0.12s ease,
      background 0.12s ease,
      border-color 0.12s ease;
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:active {
    transform: translateY(0);
  }

  .button:focus-visible {
    outline: 3px solid rgba(197, 179, 88, 0.45);
    outline-offset: 2px;
  }

  .button:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
  }

  .button--primary {
    color: var(--black);
    background: var(--gold);
    border-color: var(--gold);
  }

  .button--primary:hover {
    background: #d1c16c;
    border-color: #d1c16c;
  }

  .button--secondary {
    color: var(--black);
    background: var(--white);
    border-color: #aeb2b8;
  }

  .button--secondary:hover {
    background: #f3f3f3;
  }

  .button--danger {
    color: var(--danger);
    background: var(--white);
    border-color: #e2aaa5;
  }

  .button--large {
    min-height: 50px;
    padding-right: 24px;
    padding-left: 24px;
  }

  .button-spinner {
    width: 18px;
    height: 18px;
    display: inline-block;
    border: 2px solid rgba(0, 0, 0, 0.25);
    border-top-color: var(--black);
    border-radius: 50%;
    animation: attendance-spin 0.75s linear infinite;
  }

  /*
   * Summary cards
   */

  .summary-grid {
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
  }

  .summary-card {
    min-height: 116px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--white);
    border: 1px solid var(--border);
    border-top: 4px solid var(--gold);
    border-radius: 12px;
  }

  .summary-card span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .summary-card strong {
    margin-top: 6px;
    color: var(--black);
    font-size: 28px;
    line-height: 1;
  }

  .summary-card--rate {
    color: var(--white);
    background: var(--black);
    border-color: var(--black);
    border-top-color: var(--gold);
  }

  .summary-card--rate span {
    color: #d5d5d5;
  }

  .summary-card--rate strong {
    color: var(--gold);
  }

  #attendanceOverviewSummary {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  /*
   * Student search
   */

  .student-search {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
  }

  .student-search-results {
    margin-top: 15px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .student-search-result {
    width: 100%;
    min-height: 64px;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    color: var(--text);
    background: var(--white);
    border: 0;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }

  .student-search-result:last-child {
    border-bottom: 0;
  }

  .student-search-result:hover,
  .student-search-result:focus-visible {
    background: var(--gold-light);
    outline: none;
  }

  .student-search-result__details {
    min-width: 0;
  }

  .student-search-result__details strong,
  .student-search-result__details span {
    display: block;
  }

  .student-search-result__details strong {
    color: var(--black);
  }

  .student-search-result__details span {
    color: var(--muted);
    font-size: 13px;
  }

  .student-search-result__action {
    flex: 0 0 auto;
    color: var(--gold-dark);
    font-size: 13px;
    font-weight: 900;
  }

  /*
   * Tables
   */

  .attendance-table-container {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .attendance-table {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
    background: var(--white);
  }

  .attendance-table th,
  .attendance-table td {
    padding: 12px 11px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  .attendance-table th {
    color: var(--white);
    background: var(--black-soft);
    font-size: 12px;
    white-space: nowrap;
  }

  .attendance-table th small {
    display: block;
    margin-top: 2px;
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
  }

  .attendance-table td {
    font-size: 14px;
  }

  .attendance-table tbody tr:last-child td {
    border-bottom: 0;
  }

  .attendance-table tbody tr:hover {
    background: #faf9f3;
  }

  .student-cell strong,
  .student-cell span {
    display: block;
  }

  .student-cell strong {
    color: var(--black);
  }

  .student-cell span {
    color: var(--muted);
    font-size: 12px;
  }

  .attendance-day-cell {
    width: 86px;
    text-align: center !important;
  }

  .attendance-checkbox {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: var(--gold-dark);
    cursor: pointer;
  }

  .attendance-table__remove-heading {
    text-align: center !important;
  }

  .remove-student-button,
  .history-button {
    min-height: 36px;
    padding: 7px 11px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 800;
  }

  .remove-student-button {
    color: var(--danger);
    background: var(--danger-light);
    border: 1px solid #efbbb6;
  }

  .history-button {
    color: var(--black);
    background: var(--gold-light);
    border: 1px solid #d7c978;
  }

  /*
   * Empty states and messages
   */

  .empty-state {
    min-height: 180px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    border: 1px dashed #bfc3c9;
    border-radius: 10px;
  }

  .empty-state strong,
  .empty-state span {
    display: block;
  }

  .empty-state strong {
    margin-bottom: 4px;
    color: var(--black);
  }

  .empty-state__icon {
    width: 44px;
    height: 44px;
    margin-bottom: 12px;
    display: grid;
    place-items: center;
    color: var(--success);
    background: var(--success-light);
    border-radius: 50%;
    font-size: 23px;
    font-weight: 900;
  }

  .inline-message,
  .form-message {
    margin-top: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }

  .inline-message {
    color: var(--muted);
    background: #f3f4f6;
    border: 1px solid var(--border);
  }

  .form-message.is-success,
  .inline-message.is-success {
    color: var(--success);
    background: var(--success-light);
    border: 1px solid #a7d8bc;
  }

  .form-message.is-error,
  .inline-message.is-error {
    color: var(--danger);
    background: var(--danger-light);
    border: 1px solid #efbbb6;
  }

  .inline-loading {
    padding: 20px;
    color: var(--muted);
    text-align: center;
  }

  /*
   * Save panel
   */

  .save-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    color: var(--white);
    background: var(--black);
    border-color: var(--black);
  }

  .save-panel strong,
  .save-panel span {
    display: block;
  }

  .save-panel strong {
    color: var(--gold);
    font-size: 17px;
  }

  .save-panel > div > span {
    margin-top: 4px;
    color: #d1d1d1;
    font-size: 13px;
  }

  /*
   * Overview
   */

  .overview-filters {
    display: grid;
    grid-template-columns:
      repeat(3, minmax(150px, 1fr))
      auto;
    align-items: end;
    gap: 16px;
  }

  .table-search {
    width: min(280px, 100%);
  }

  .table-search input {
    min-height: 40px;
  }

  .campus-summary-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .campus-summary-card {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafafa;
  }

  .campus-summary-card h4 {
    margin: 0 0 12px;
    color: var(--black);
    font-size: 18px;
  }

  .campus-summary-card dl {
    margin: 0;
  }

  .campus-summary-card dl > div {
    padding: 6px 0;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #e6e6e6;
  }

  .campus-summary-card dl > div:last-child {
    border-bottom: 0;
  }

  .campus-summary-card dt {
    color: var(--muted);
    font-size: 12px;
  }

  .campus-summary-card dd {
    margin: 0;
    color: var(--black);
    font-size: 13px;
    font-weight: 800;
  }

  /*
   * Student history modal
   */

  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    padding: 22px;
    display: grid;
    place-items: center;
  }

  .modal__backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.68);
  }

  .modal__panel {
    position: relative;
    z-index: 1;
    width: min(760px, 100%);
    max-height: calc(100vh - 44px);
    overflow: hidden;
    background: var(--white);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  .modal__header {
    padding: 22px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    color: var(--white);
    background: var(--black);
    border-bottom: 4px solid var(--gold);
  }

  .modal__header h2 {
    margin: 0;
    font-size: 24px;
  }

  .modal__header p {
    margin: 5px 0 0;
    color: #d0d0d0;
    font-size: 13px;
  }

  .modal__close {
    width: 42px;
    height: 42px;
    display: grid;
    flex: 0 0 42px;
    place-items: center;
    color: var(--white);
    background: transparent;
    border: 1px solid #646464;
    border-radius: 50%;
    font-size: 28px;
    line-height: 1;
  }

  .modal__close:hover {
    color: var(--black);
    background: var(--gold);
    border-color: var(--gold);
  }

  .modal__body {
    max-height: calc(100vh - 180px);
    padding: 24px;
    overflow-y: auto;
  }

  .history-total {
    margin-bottom: 18px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--gold-light);
    border-radius: 9px;
  }

  .history-total span {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
  }

  .history-total strong {
    color: var(--black);
    font-size: 25px;
  }

  /*
   * Toast and footer
   */

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 150;
    width: min(390px, calc(100% - 44px));
    padding: 14px 17px;
    color: var(--white);
    background: var(--black);
    border-left: 5px solid var(--gold);
    border-radius: 9px;
    box-shadow: var(--shadow);
    font-size: 14px;
    font-weight: 700;
  }

  .toast.is-success {
    background: var(--success);
    border-left-color: #8ce0b2;
  }

  .toast.is-error {
    background: var(--danger);
    border-left-color: #ffb7b0;
  }

  .attendance-footer {
    padding: 24px 20px;
    color: #bdbdbd;
    background: var(--black);
    border-top: 3px solid var(--gold);
    text-align: center;
  }

  .attendance-footer p {
    margin: 0;
    font-size: 12px;
  }

  /*
   * Tablet
   */

  @media (max-width: 980px) {
    .report-settings,
    .overview-filters {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .report-settings__action .button,
    .overview-filters__action .button {
      width: 100%;
    }

    .summary-grid,
    .campus-summary-grid {
      grid-template-columns:
