        document.createElement('div');

      wrapper.appendChild(
        textElement('dt', term)
      );

      wrapper.appendChild(
        textElement(
          'dd',
          String(value)
        )
      );

      list.appendChild(wrapper);
    }


    function textElement(
      tag,
      text,
      className
    ) {
      var element =
        document.createElement(tag);

      element.textContent =
        text == null
          ? ''
          : String(text);

      if (className) {
        element.className =
          className;
      }

      return element;
    }


    function textCell(text) {
      var cell =
        document.createElement('td');

      cell.textContent =
        text == null
          ? ''
          : String(text);

      return cell;
    }


    function clearElement(element) {
      while (element.firstChild) {
        element.removeChild(
          element.firstChild
        );
      }
    }


    function byId(id) {
      return document.getElementById(id);
    }


    function valueOf(id) {
      return String(
        byId(id).value || ''
      ).trim();
    }


    function numberFromText(value) {
      var number = Number(
        String(value || '')
          .replace(/,/g, '')
      );

      return Number.isFinite(number)
        ? number
        : 0;
    }


    function arrayToDateMap(values) {
      var map = {};

      values.forEach(function(value) {
        if (value) {
          map[value] = true;
        }
      });

      return map;
    }


    function weekDateKeys(monday) {
      return [0, 1, 2, 3, 4]
        .map(function(offset) {
          return addDateDays(
            monday,
            offset
          );
        });
    }


    function validDateKey(value) {
      return (
        /^\d{4}-\d{2}-\d{2}$/.test(
          String(value || '')
        ) &&
        !Number.isNaN(
          parseDateKey(value).getTime()
        )
      );
    }


    function parseDateKey(value) {
      var parts =
        String(value || '')
          .split('-');

      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2]),
        12,
        0,
        0
      );
    }


    function dateKey(date) {
      return (
        date.getFullYear() +
        '-' +
        pad2(date.getMonth() + 1) +
        '-' +
        pad2(date.getDate())
      );
    }


    function addDateDays(
      value,
      days
    ) {
      var date =
        typeof value === 'string'
          ? parseDateKey(value)
          : new Date(
              value.getTime()
            );

      date.setDate(
        date.getDate() + days
      );

      return dateKey(date);
    }


    function formatDate(value) {
      if (!validDateKey(value)) {
        return '-';
      }

      return parseDateKey(value)
        .toLocaleDateString(
          undefined,
          {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          }
        );
    }


    function shortDate(value) {
      if (!validDateKey(value)) {
        return '';
      }

      return parseDateKey(value)
        .toLocaleDateString(
          undefined,
          {
            month: 'numeric',
            day: 'numeric'
          }
        );
    }


    function formatPercent(value) {
      var number = Number(value);

      return (
        (
          Number.isFinite(number)
            ? number * 100
            : 0
        ).toFixed(2) +
        '%'
      );
    }


    function pad2(value) {
      return value < 10
        ? '0' + value
        : String(value);
    }


    function isSessionError(message) {
      return /session|sign in|login required|expired/i.test(
        String(message || '')
      );
    }


    function errorMessage(error) {
      if (!error) {
        return (
          'An unexpected error occurred. ' +
          'Please try again.'
        );
      }

      var message =
        typeof error === 'string'
          ? error
          : (
              error.message ||
              error.toString() ||
              ''
            );

      return String(message)
        .replace(
          /^Exception:\s*/i,
          ''
        )
        .replace(
          /^Error:\s*/i,
          ''
        )
        .trim() || (
          'An unexpected error occurred. ' +
          'Please try again.'
        );
    }
  })();
</script>
